[package]
name = "effie-macros"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Matilde Morrone <contact@morrone.dev>"]
description = "Macros for effie"
documentation = "https://docs.rs/effie-macros"
repository = "https://github.com/tailwags/effie"
include = ["src/**/*.rs", "../README.md", "LICENSE"]
readme = "../README.md"

[lib]
proc-macro = true

[dependencies]
quote = "1.0.46"
syn = { version = "2.0.118", default-features = false, features = [
    "parsing",
    "proc-macro",
] }
